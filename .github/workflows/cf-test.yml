name: Cloudflare image test
on:
  push:
    branches: [claude/youtube-automation-review-k9f3cu]
    paths: [.github/workflows/cf-test.yml, tools/cf_test.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/cf_test.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cftest
          path: cftest/*
