name: Cloudflare size test
on:
  push:
    branches: [claude/youtube-automation-review-k9f3cu]
    paths: [.github/workflows/cf-test.yml, tools/cf_size.py]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && python tools/cf_size.py
        env:
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sz
          path: sz_*.jpg
