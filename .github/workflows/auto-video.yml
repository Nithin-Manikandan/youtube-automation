name: Auto video

# plan (AI + narration + sound)  ->  draw the scenes on 4 machines at once  ->  assemble
on:
  workflow_dispatch:
    inputs:
      hint:
        description: "Optional topic hint (blank = the AI picks)"
        required: false
      plan_only:
        description: "true = only write the script and plan (fast); download plan.pkl and render a few scenes locally to check them"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Topic, script, fact-check, narration, music and sound effects, thumbnails
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HINT: ${{ github.event.inputs.hint }}
        run: python -m studio.run_auto --phase plan --hint "$HINT" --out output/auto
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          retention-days: 3
          compression-level: 0
          path: |
            output/auto/plan.pkl
            output/auto/mix.flac
            output/auto/out/thumb*.jpg

  draw:
    needs: plan
    if: github.event.inputs.plan_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: output/auto
      - name: Draw this machine's share of the scenes
        run: python -m studio.run_auto --phase render --shard ${{ matrix.shard }} --shards 8 --out output/auto
      - uses: actions/upload-artifact@v4
        with:
          name: scenes-${{ matrix.shard }}
          retention-days: 1
          compression-level: 0
          path: output/auto/seg/*.mp4

  assemble:
    needs: draw
    if: github.event.inputs.plan_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: output/auto
      - uses: actions/download-artifact@v4
        with:
          pattern: scenes-*
          merge-multiple: true
          path: output/auto/seg
      - name: Join the scenes and add the audio
        run: python -m studio.run_auto --phase assemble --out output/auto
      - name: The finished video, thumbnails and publishing package
        uses: actions/upload-artifact@v4
        with:
          name: auto-video
          retention-days: 7
          compression-level: 0
          path: |
            output/auto/out/*
            output/auto/auto.json
