name: Layers test
on:
  push:
    branches: [claude/youtube-automation-review-k9f3cu]
    paths: [.github/workflows/layers-test.yml, tools/layers_test.py, tools/layers_scenes.json]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/layers_test.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
      - uses: actions/upload-artifact@v4
        with:
          name: layers
          path: layers_out/*
