name: Image test (CPU SDXL-Turbo, no secrets)
on:
  push:
    branches: [claude/youtube-automation-review-k9f3cu]
    paths: [.github/workflows/img-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get stable-diffusion.cpp and SDXL-Turbo (public)
        run: |
          mkdir -p m && cd m
          curl -sL -o sd.zip https://github.com/leejet/stable-diffusion.cpp/releases/download/master-929-3f8527a/sd-master-3f8527a-bin-Linux-Ubuntu-24.04-x86_64.zip && unzip -o -q sd.zip
          curl -sL -O https://huggingface.co/stabilityai/sdxl-turbo/resolve/main/sd_xl_turbo_1.0_fp16.safetensors
          curl -sL -O https://huggingface.co/madebyollin/sdxl-vae-fp16-fix/resolve/main/sdxl_vae.safetensors
          ls -la; nproc
      - name: Draw test scenes with timing
        run: |
          cd m; chmod +x sd-cli
          STYLE="hand-drawn 2D webcomic illustration, simple white round-headed stick figure characters with messy brown hair and tiny dot eyes, thin black ink outlines, rough brown tunics, warm muted peach and sepia colour palette, soft paper grain, flat colours, wide shot"
          i=0
          for SCENE in "a medieval London street at dawn, a worker standing knee-deep in a muddy pit holding a wooden bucket, a second man pinching his nose" "a king sitting on a padded toilet stool in a stone palace room while a servant kneels beside him holding a cloth, funny"; do
            i=$((i+1)); S=$(date +%s)
            timeout 600 ./sd-cli -m sd_xl_turbo_1.0_fp16.safetensors --vae sdxl_vae.safetensors -p "$STYLE, $SCENE" -n "photo, 3d render, realistic, text, watermark, blurry" --cfg-scale 1.0 --steps 4 --sampling-method euler_a -H 576 -W 1024 -t $(nproc) -s 3$i -o ../out$i.png 2>&1 | tail -6
            echo "scene $i took $(( $(date +%s) - S )) s"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imgtest
          path: out*.png
