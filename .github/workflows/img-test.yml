name: Image test (CPU FLUX, no secrets)
on:
  push:
    branches: [claude/youtube-automation-review-k9f3cu]
    paths: [.github/workflows/img-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Get stable-diffusion.cpp and the FLUX schnell files (all public)
        run: |
          mkdir -p m && cd m
          curl -sL -o sd.zip https://github.com/leejet/stable-diffusion.cpp/releases/download/master-929-3f8527a/sd-master-3f8527a-bin-Linux-Ubuntu-24.04-x86_64.zip && unzip -o -q sd.zip && ls -la
          curl -sL -O https://huggingface.co/city96/FLUX.1-schnell-gguf/resolve/main/flux1-schnell-Q4_K_S.gguf
          curl -sL -O https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/clip_l.safetensors
          curl -sL -O https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/t5xxl_fp8_e4m3fn.safetensors
          curl -sL -O https://huggingface.co/second-state/FLUX.1-schnell-GGUF/resolve/main/ae.safetensors
          ls -la; nproc; free -g
      - name: Draw two test scenes
        run: |
          cd m; chmod +x sd* 2>/dev/null; BIN=$(ls | grep -E '^sd(-cli)?$' | head -1); echo bin=$BIN
          STYLE="hand-drawn 2D webcomic illustration, simple white round-headed stick figure characters with messy brown hair and tiny dot eyes, thin black ink outlines, rough brown tunics, warm muted peach and sepia colour palette, soft paper grain, flat colours, wide shot, no text"
          i=0
          for SCENE in "a medieval London street at dawn, a worker standing knee-deep in a muddy pit holding a wooden bucket, a second man pinching his nose" "a king sitting on a padded toilet stool in a stone palace room while a servant kneels beside him holding a cloth, funny"; do
            i=$((i+1)); S=$(date +%s)
            ./$BIN --diffusion-model flux1-schnell-Q4_K_S.gguf --vae ae.safetensors --clip_l clip_l.safetensors --t5xxl t5xxl_fp8_e4m3fn.safetensors \
              -p "$STYLE, $SCENE" --cfg-scale 1.0 --sampling-method euler --steps 4 -H 576 -W 1024 -t $(nproc) -s 7$i -o ../out$i.png -v 2>&1 | tail -5
            echo "scene $i took $(( $(date +%s) - S )) s"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imgtest
          path: out*.png
