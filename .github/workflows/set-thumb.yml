name: Set thumbnail
on:
  push:
    branches: [claude/youtube-automation-review-k9f3cu]
    paths: [tools/set_thumb.json]
permissions:
  contents: read
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the thumbnail on the video
        run: |
          pip install -q requests
          python - <<'PY'
          import json, sys, requests
          sys.path.insert(0, '.')
          from pipeline.upload import _access_token
          cfg = json.load(open('tools/set_thumb.json'))
          r = requests.post(f"https://www.googleapis.com/upload/youtube/v3/thumbnails/set?videoId={cfg['video_id']}",
                            headers={'Authorization': 'Bearer ' + _access_token(), 'Content-Type': 'image/jpeg'}, data=open(cfg['file'], 'rb').read(), timeout=120)
          print('THUMBNAIL', r.status_code, r.text[:200])
          sys.exit(0 if r.status_code == 200 else 1)
          PY
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
