name: Make clips

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "DIRECT download link to a video you have rights to (not a YouTube page)"
        required: true
      count:
        description: "How many clips"
        default: "5"

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-clip.txt
      - name: Make the clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          COUNT: ${{ github.event.inputs.count }}
        run: python -m pipeline.clipper --source "$SOURCE_URL" --count "$COUNT"
      - uses: actions/upload-artifact@v4
        with:
          name: clips
          path: output/clips/*
